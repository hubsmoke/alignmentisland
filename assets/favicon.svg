<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d78"/>
      <stop offset="0.52" stop-color="#a15bff"/>
      <stop offset="1" stop-color="#35e6ff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e2e"/>
      <stop offset="1" stop-color="#08060f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tile)" stroke="url(#neon)" stroke-width="2.2" stroke-opacity="0.65"/>
  <!-- horizon / pool line -->
  <rect x="13" y="45" width="38" height="2.4" rx="1.2" fill="url(#neon)" opacity="0.85" filter="url(#glow)"/>
  <text x="32" y="30" text-anchor="middle" dominant-baseline="central"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900"
        font-size="30" letter-spacing="-1.5" fill="url(#neon)" filter="url(#glow)">AI</text>
</svg>
